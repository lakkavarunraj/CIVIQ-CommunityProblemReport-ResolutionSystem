<!-- Image Preview Script -->
<script>
function previewMultipleImages(event) {
    var container = document.getElementById('imagePreviewContainer');
    container.innerHTML = "";
    const files = event.target.files;

    if (files.length > 5) {
        alert("You can upload a maximum of 5 images.");
        event.target.value = "";
        return;
    }

    Array.from(files).forEach(file => {
        var img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        img.classList.add("img-fluid", "rounded", "shadow");
        img.style.maxHeight = "150px";
        img.style.margin = "5px";
        container.appendChild(img);
    });
}
</script>

<!-- Leaflet JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const defaultLat = 20.5937; // India fallback
    const defaultLng = 78.9629;
    let map, marker;

    // Function to initialize map
    function initMap(lat, lng, zoom = 14) {
        map = L.map('map').setView([lat, lng], zoom);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>'
        }).addTo(map);

        marker = L.marker([lat, lng]).addTo(map)
            .bindPopup("You are here").openPopup();

        document.getElementById('location').value = lat.toFixed(6) + ', ' + lng.toFixed(6);

        // Let user change marker by clicking
        map.on('click', function (e) {
            const newLat = e.latlng.lat.toFixed(6);
            const newLng = e.latlng.lng.toFixed(6);

            marker.setLatLng(e.latlng);
            document.getElementById('location').value = newLat + ', ' + newLng;
        });
    }

    // Try live geolocation first
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function (position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                initMap(lat, lng, 16); // zoom close to user
            },
            function () {
                alert("Geolocation denied. Showing default India location.");
                initMap(defaultLat, defaultLng, 5);
            }
        );
    } else {
        alert("Geolocation not supported. Showing default location.");
        initMap(defaultLat, defaultLng, 5);
    }
</script>
