<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiviQ - Register & Login</title>
    <link rel="stylesheet" href="regi.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div id="container" class="container sign-up">
        <!-- FORM SECTION -->
        <div class="form-section">
            <!-- SIGN UP FORM -->
            <form method="post" action="reg.php" class="form sign-up">
                <div class="logo-wrapper">
                    <img src="img/logo.png" alt="Website Logo">
                </div>

                <!-- First + Last Name -->
                <div class="input-row">
                    <div class="input-group">
                        <i class='bx bxs-user'></i>
                        <input type="text" name="firstname" placeholder="First Name" required>
                    </div>
                    <div class="input-group">
                        <i class='bx bxs-user'></i>
                        <input type="text" name="lastname" placeholder="Last Name" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <i class='bx bx-mail-send'></i>
                    <input type="email" name="email" placeholder="Email" required>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <i class='bx bxs-lock-alt'></i>
                    <input type="password" name="pass" placeholder="Password" required>
                </div>

                <!-- Gender -->
                <div class="input-group">
                    <i class='bx bx-male-female'></i>
                    <select name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Contact -->
                <div class="input-group">
                    <i class='bx bxs-phone'></i>
                    <input type="text" name="contact" placeholder="Contact No" required>
                </div>

                <!-- Address (Main Attribute with Sub Attributes) -->
                <div class="address-section">
                    <label><i class='bx bxs-map-alt'></i> Address</label>

                    <div class="input-row">
                        <div class="input-group">
                            <i class='bx bxs-home'></i>
                            <input type="text" name="hno" placeholder="House No">
                        </div>
                        <div class="input-group">
                            <i class='bx bxs-buildings'></i>
                            <input type="text" name="block" placeholder="Block Name">
                        </div>
                    </div>

                    <div class="input-group">
                        <i class='bx bxs-map'></i>
                        <input type="text" name="street" placeholder="Street">
                    </div>
                </div>

                <button type="submit">Register</button>
                <p>
                    <span>Already have an account?</span>
                    <a href="login.html" class="pointer" style="color: #86B817; font-weight: 600; text-decoration: none;">
                        Log in here
                    </a>
                </p>
            </form>
        </div>
        <!-- END FORM SECTION -->

        <!-- CONTENT SECTION -->
        <div class="content-section">
            <!-- SIGN IN CONTENT -->
            <div class="col align-items-center flex-col sign-in-content">
                <div class="text sign-in">
                    <div class="content-logo">
                        <img src="img/login1.jpg" alt="Welcome to Community Problem Reporting">
                    </div>
                </div>
            </div>

            <!-- SIGN UP CONTENT -->
            <div class="col align-items-center flex-col sign-up-content">
                <div class="text sign-up">
                    <div class="content-logo">
                        <img src="img/login2.png" alt="Join With Us">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let container = document.getElementById('container')
        toggle = () => {
            container.classList.toggle('sign-in')
            container.classList.toggle('sign-up')
        }
    </script>
</body>
</html>
